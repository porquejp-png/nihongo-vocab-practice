<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>にほんご語彙トレーニング Lesson 15</title>
<style>
:root{--blue:#2457a6;--ink:#172033}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:680px;margin:auto;padding:18px}h1{font-size:1.45rem;margin:8px 0 4px}.sub{color:#5c6575;margin:0 0 18px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,select{font:inherit;border-radius:12px;padding:12px 14px;border:1px solid #c9d2e1;background:white;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.45}
.panel{background:white;border:1px solid #dce2ec;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #15284a0a}.jp{font-size:2rem;font-weight:700;text-align:center;overflow-wrap:anywhere;padding:18px 0}.trans{font-size:1.15rem;text-align:center;line-height:1.6;overflow-wrap:anywhere}.muted{color:#697386;font-size:.92rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row button{flex:1}.choice{display:block;width:100%;text-align:left;margin:8px 0;min-height:52px}.count{text-align:center;font-weight:600;margin:8px}.hidden{display:none}.good{color:#187344}.bad{color:#a33a31}select{max-width:100%}footer{font-size:.82rem;color:#667085;margin-top:22px;line-height:1.5}
</style></head><body><main>
<h1>にほんご語彙トレーニング</h1><p class="sub">つなぐ日本語・Lesson 15｜自分のペースで練習しよう</p>
<div class="row"><label for="unit">範囲：</label><select id="unit"><option value="all">Lesson 15 全体</option><option value="15-1">15-1</option><option value="15-2">15-2</option></select></div>
<nav><button class="primary" id="cardsTab">語彙カード</button><button id="quizTab">4択クイズ</button></nav>
<section id="cards"><div class="panel"><div class="count" id="cardCount"></div><div class="jp" id="cardJp"></div><div class="trans hidden" id="cardEn"></div><div class="trans hidden" id="cardNe"></div><p class="muted" style="text-align:center">日本語を見て、意味を思い出してから答えを見よう。</p><div class="row"><button id="reveal" class="primary">意味を見る</button><button id="nextCard">次のカード →</button></div></div></section>
<section id="quiz" class="hidden"><div class="panel"><div class="count" id="quizCount"></div><div class="jp" id="quizJp"></div><p style="text-align:center">正しい英語の意味を選んでください。</p><div id="choices"></div><div id="feedback" aria-live="polite"></div><div class="row" style="margin-top:14px"><button id="nextQ" class="primary" disabled>次の問題 →</button></div></div><div class="count" id="score"></div><button id="restart" class="hidden">もう一度挑戦する</button></section>
<footer>アップロードされた語彙リストの日本語・英語・ネパール語を使用しています。訳語は元ファイルの表記をそのまま表示します。</footer>
</main><script>
const vocab=[{"lesson": "15-1", "jp": "こわします", "en": "break", "ne": "बिगार्नु"}, {"lesson": "15-1", "jp": "けります", "en": "kick", "ne": "लातले हान्‍नु"}, {"lesson": "15-1", "jp": "あてます", "en": "hit", "ne": "अनुमान मिल्नु"}, {"lesson": "15-1", "jp": "もうしわけ ありません", "en": "I'm very sorry.", "ne": "माफ गर्नुहोस्"}, {"lesson": "15-1", "jp": "しょるい", "en": "documents", "ne": "कागजात"}, {"lesson": "15-1", "jp": "よごします", "en": "make ... dirty", "ne": "फोहोर बनाउनु"}, {"lesson": "15-1", "jp": "かびん", "en": "vase", "ne": "फूलदानि"}, {"lesson": "15-1", "jp": "わります", "en": "break", "ne": "विभाजन गर्नु"}, {"lesson": "15-1", "jp": "おとします", "en": "drop", "ne": "खसाल्‍नु"}, {"lesson": "15-1", "jp": "ぶつかります", "en": "hit", "ne": "ठोकिनु"}, {"lesson": "15-1", "jp": "たおします", "en": "knock over", "ne": "ढल्‍नु"}, {"lesson": "15-1", "jp": "気を つけます", "en": "take care", "ne": "ध्यान दिनु"}, {"lesson": "15-1", "jp": "山のぼり", "en": "mountain climbing", "ne": "पर्वताराेहण"}, {"lesson": "15-1", "jp": "サーフィン", "en": "surfing", "ne": "सर्फिङ"}, {"lesson": "15-1", "jp": "へいじつ", "en": "weekday", "ne": "हप्ताका बिदा बहेकका दिनहरू"}, {"lesson": "15-1", "jp": "すいて います", "en": "not crowded", "ne": "खाली छ अथवा कम छ"}, {"lesson": "15-2", "jp": "あのね", "en": "Well...", "ne": "तपाईलाई थाहा छ ....."}, {"lesson": "15-2", "jp": "え～", "en": "Oh gosh!", "ne": "ए~"}, {"lesson": "15-2", "jp": "しかたが ありません", "en": "There is nothing you can do.", "ne": "उपाय छैन"}, {"lesson": "15-2", "jp": "あぶない", "en": "dangerous", "ne": "खतरनाक"}];const unit=document.getElementById('unit');let pool=[],cardIndex=0,quizSet=[],qIndex=0,score=0,answered=false;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function setPool(){pool=vocab.filter(x=>unit.value==='all'||x.lesson===unit.value);if(!pool.length)pool=[...vocab]}
function showTab(tab){document.getElementById('cards').classList.toggle('hidden',tab!=='cards');document.getElementById('quiz').classList.toggle('hidden',tab!=='quiz');document.getElementById('cardsTab').classList.toggle('primary',tab==='cards');document.getElementById('quizTab').classList.toggle('primary',tab==='quiz')}
function showCard(){cardIndex=(cardIndex+pool.length)%pool.length;const x=pool[cardIndex];document.getElementById('cardCount').textContent=`${cardIndex+1} / ${pool.length}（${x.lesson}）`;document.getElementById('cardJp').textContent=x.jp;document.getElementById('cardEn').textContent=x.en;document.getElementById('cardNe').textContent=x.ne;document.getElementById('cardEn').classList.add('hidden');document.getElementById('cardNe').classList.add('hidden');document.getElementById('reveal').textContent='意味を見る'}
function startQuiz(){setPool();let distinct=[];let seen=new Set();for(const x of shuffle(pool)){if(!seen.has(x.en)){distinct.push(x);seen.add(x.en)}}quizSet=distinct.slice(0,Math.min(10,distinct.length));qIndex=0;score=0;showTab('quiz');document.getElementById('restart').classList.add('hidden');document.getElementById('nextQ').classList.remove('hidden');renderQ()}
function renderQ(){answered=false;const x=quizSet[qIndex];document.getElementById('quizCount').textContent=`問題 ${qIndex+1} / ${quizSet.length}`;document.getElementById('quizJp').textContent=x.jp;document.getElementById('feedback').textContent='';document.getElementById('feedback').className='';document.getElementById('nextQ').disabled=true;document.getElementById('nextQ').textContent=qIndex===quizSet.length-1?'結果を見る':'次の問題 →';document.getElementById('score').textContent=`現在の正解数：${score}`;let opts=shuffle([x,...shuffle(pool.filter(y=>y.en!==x.en)).filter((y,i,a)=>a.findIndex(z=>z.en===y.en)===i).slice(0,3)]);const box=document.getElementById('choices');box.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.en;b.onclick=()=>answer(o,x);box.appendChild(b)})}
function answer(o,x){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const f=document.getElementById('feedback');if(o.jp===x.jp){score++;f.textContent='正解です！';f.className='good'}else{f.textContent='もう一度覚えよう。正解：'+x.en+' ／ '+x.ne;f.className='bad'}document.getElementById('score').textContent=`現在の正解数：${score}`;document.getElementById('nextQ').disabled=false}
unit.addEventListener('change',()=>{setPool();cardIndex=0;showCard();if(!document.getElementById('quiz').classList.contains('hidden'))startQuiz()});document.getElementById('cardsTab').onclick=()=>showTab('cards');document.getElementById('quizTab').onclick=startQuiz;
document.getElementById('reveal').onclick=()=>{document.getElementById('cardEn').classList.remove('hidden');document.getElementById('cardNe').classList.remove('hidden');document.getElementById('reveal').textContent='意味を確認しました'};
document.getElementById('nextCard').onclick=()=>{cardIndex++;showCard()};
document.getElementById('nextQ').onclick=()=>{if(qIndex<quizSet.length-1){qIndex++;renderQ()}else{document.getElementById('quizCount').textContent='クイズ終了！';document.getElementById('quizJp').textContent=`${quizSet.length}問中 ${score}問 正解`;document.getElementById('choices').innerHTML='';document.getElementById('feedback').textContent=score===quizSet.length?'すばらしい！全問正解です。':'間違えた語彙をカードでもう一度確認しましょう。';document.getElementById('nextQ').classList.add('hidden');document.getElementById('restart').classList.remove('hidden')}};
document.getElementById('restart').onclick=startQuiz;setPool();showCard();
</script></body></html>
