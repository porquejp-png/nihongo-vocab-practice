<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>にほんご語彙トレーニング</title>
<style>
:root{--blue:#2457a6;--ink:#172033;--muted:#657084;--line:#dce3ee}
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:22px 16px 34px}
header{text-align:center;padding:24px 14px 20px}
.mark{font-size:2.5rem}
h1{font-size:1.65rem;line-height:1.4;margin:8px 0}
header p{color:var(--muted);margin:0;line-height:1.7}
h2{font-size:1.15rem;margin:16px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
a.card{display:block;text-decoration:none;color:inherit;background:white;border:1px solid var(--line);border-radius:18px;padding:18px 16px;box-shadow:0 3px 12px #15284a0a;transition:transform .12s ease}
a.card:active{transform:scale(.99)}
.lesson{font-size:1.3rem;font-weight:750;margin-bottom:7px}
.desc{color:var(--muted);font-size:.9rem;line-height:1.55}
.arrow{color:var(--blue);font-weight:700;margin-top:14px}
.notice{background:#eaf1ff;border-radius:14px;padding:14px 16px;margin-top:18px;font-size:.92rem;line-height:1.65}
footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:22px}
@media(max-width:430px){.grid{grid-template-columns:1fr}header{padding-top:12px}}
</style>
</head>
<body>
<main>
<header>
<div class="mark" aria-hidden="true">📚</div>
<h1>にほんご語彙トレーニング</h1>
<p>スマートフォンで、いつでも復習！<br>学習したい課を選んでください。</p>
</header>
<h2>学習する課</h2>
<div class="grid">
<a class="card" href="./Lesson1.html" aria-label="Lesson 1">
<div class="lesson">Lesson 1</div>
<div class="desc">語彙カード・4択クイズ</div>
<div class="arrow">学習する →</div>
</a>
<a class="card" href="./Lesson15.html" aria-label="Lesson 15">
<div class="lesson">Lesson 15</div>
<div class="desc">語彙カード・4択クイズ</div>
<div class="arrow">学習する →</div>
</a>
</div>
<div class="notice">
<strong>使い方</strong><br>
① 課を選びます。<br>
② 語彙カードで意味を確認します。<br>
③ 4択クイズに挑戦し、正解数を確認しましょう。
</div>
<footer>これから学習できる課を少しずつ増やしていきます。</footer>
</main>
</body>
</html>
